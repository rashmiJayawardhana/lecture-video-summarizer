# Module 1: Keyframe Detection & Importance Scoring Configuration

model:
  name: "VideoImportanceScorer"
  hidden_size: 512
  num_lstm_layers: 2
  dropout: 0.3
  pretrained_backbone: true

training:
  batch_size: 8
  num_epochs: 50
  learning_rate: 0.001
  weight_decay: 0.0001
  optimizer: "adam"
  scheduler: "cosine"
  
data:
  segment_duration: 10  # seconds
  frame_sample_rate: 30  # sample every 30 frames (1 fps at 30fps video)
  sequence_length: 10  # number of frames per segment
  image_size: 224
  train_split: 0.8
  val_split: 0.1
  test_split: 0.1

augmentation:
  random_crop: true
  random_flip: true
  color_jitter: true
  normalize:
    mean: [0.485, 0.456, 0.406]
    std: [0.229, 0.224, 0.225]

paths:
  data_dir: "./data/datasets/module1"
  model_save_dir: "./models/module1"
  log_dir: "./outputs/logs/module1"

logging:
  use_wandb: true
  log_interval: 10  # log every 10 batches
  save_interval: 5  # save checkpoint every 5 epochs
