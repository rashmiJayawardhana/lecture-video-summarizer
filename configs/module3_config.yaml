# Module 3: Visual Content Understanding & Slide Extraction Configuration

model:
  name: "SlideImportanceClassifier"
  base_model: "google/vit-base-patch16-224"
  num_labels: 3  # Critical, Important, Skip
  dropout: 0.1

slide_extraction:
  similarity_threshold: 0.95  # SSIM threshold for detecting new slides
  sample_rate: 30  # check every 30 frames (1 second at 30fps)
  min_slide_duration: 2  # minimum seconds a slide must be shown

ocr:
  engine: "tesseract"
  language: "eng"
  confidence_threshold: 60

training:
  batch_size: 32
  num_epochs: 20
  learning_rate: 3e-5
  weight_decay: 0.01
  optimizer: "adamw"

data:
  image_size: 224
  train_split: 0.8
  val_split: 0.1
  test_split: 0.1

augmentation:
  random_crop: true
  random_rotation: 5  # degrees
  color_jitter: true
  normalize:
    mean: [0.5, 0.5, 0.5]
    std: [0.5, 0.5, 0.5]

paths:
  data_dir: "./data/datasets/module3"
  model_save_dir: "./models/module3"
  log_dir: "./outputs/logs/module3"

logging:
  use_wandb: true
  log_interval: 10
  save_interval: 5
