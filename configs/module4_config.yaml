# Module 4: Video Synthesis & Intelligent Editing Configuration

model:
  name: "TransitionQualityPredictor"
  architecture: "3d_cnn"  # 3d_cnn or i3d
  num_frames: 16  # frames per clip
  dropout: 0.3

training:
  batch_size: 4  # smaller due to 3D convolutions
  num_epochs: 30
  learning_rate: 0.0001
  weight_decay: 0.0001
  optimizer: "adam"

data:
  clip_duration: 1  # seconds
  frame_size: [112, 112]  # height, width
  train_split: 0.8
  val_split: 0.1
  test_split: 0.1

video_editing:
  transition_duration: 0.5  # seconds
  transition_type: "crossfade"  # crossfade, fade, cut
  fps: 24
  codec: "libx264"
  bitrate: "5000k"
  audio_codec: "aac"

paths:
  data_dir: "./data/datasets/module4"
  model_save_dir: "./models/module4"
  log_dir: "./outputs/logs/module4"

logging:
  use_wandb: true
  log_interval: 5
  save_interval: 5
