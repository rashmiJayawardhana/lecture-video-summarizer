# Pipeline Configuration - End-to-End Lecture Video Summarization
# INTEGRA Project — Automated Lecture Video Summarization with Condensed Video Output

pipeline:
  target_duration: 600  # 10 minutes in seconds (max output length)
  max_duration: 600     # Hard cap enforced programmatically
  compression_ratio: 6  # 60 min -> 10 min
  segment_duration: 10  # 10-second segments as scoring unit

# Weighted Score Fusion: S = w1·V + w2·T + w3·L
# Module 4 CONSUMES this fusion output — it does NOT contribute a score
fusion:
  weights:
    w1_visual: 0.33    # Module 1: Visual importance score (score_V)
    w2_text: 0.33      # Module 2: Text importance ratio (importance_ratio_T)
    w3_slide: 0.34     # Module 3: Slide label score (score_L)
  # Grid search candidates for Week 7 tuning:
  # Option A: (0.4, 0.4, 0.2)
  # Option B: (0.5, 0.3, 0.2)
  # Option C: (0.33, 0.33, 0.33) — default
  min_score_threshold: 0.3  # Segments below this are excluded
  min_topic_sections: 3     # Selected segments must span >= 3 topic sections

modules:
  module1:
    enabled: true
    config: "./configs/module1_config.yaml"
    
  module2:
    enabled: true
    config: "./configs/module2_config.yaml"
    
  module3:
    enabled: true
    config: "./configs/module3_config.yaml"
    
  module4:
    enabled: true
    config: "./configs/module4_config.yaml"

segment_selection:
  strategy: "greedy"  # greedy, dynamic_programming
  min_segment_duration: 10  # seconds (fixed 10-second segments)
  max_segment_duration: 60  # seconds (for merged adjacent segments)
  coverage_constraint: true  # Enforce topic diversity

video_processing:
  input_resolution: [1280, 720]  # width, height
  output_resolution: [1280, 720]
  fps: 24
  codec: "libx264"
  quality: "high"

output:
  save_metadata: true
  save_intermediate: true  # Save per-module JSON outputs for debugging
  output_dir: "./outputs/summaries"

logging:
  level: "INFO"
  log_file: "./outputs/logs/pipeline.log"
  use_tensorboard: true
  tensorboard_dir: "./outputs/logs/tensorboard"
